name: Report a bug
description: Something in TrenchHQ is not working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For setup questions, use [Q&A](https://github.com/gautamgpt1/TrenchHQ/discussions/categories/q-a).
        Report security issues [privately](https://github.com/gautamgpt1/TrenchHQ/security/advisories/new).
        Do not attach API keys, settings folders, raw logs or private wallet/browser data.
  - type: input
    id: version
    attributes:
      label: App version or source commit
      description: Find the version in Help and FAQ; for a source build, include the commit if known.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: See Settings → System → About. For layout issues, also include monitor count and display scaling.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Price Ticker
        - Wallet Watcher
        - X Tracker
        - Website
        - Application Window
        - Desktop panels or overlays
        - API Connections
        - Startup or installation
        - Build or development setup
        - Something else
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Start from opening the app and describe the shortest path to the problem. Name the exchange/chain/provider if relevant, without credentials.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or diagnostics (optional)
      description: Review and redact attachments first. Help and FAQ → Save diagnostics exports a local JSON file; it is not required to report a bug.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that this report and its attachments contain no secrets or private data.
          required: true
