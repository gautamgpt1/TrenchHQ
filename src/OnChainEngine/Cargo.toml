[package]
name = "trenchhq-onchain-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
name = "trenchhq_onchain_engine"
path = "src/lib.rs"

[[bin]]
name = "trenchhq-onchain-engine"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
bs58 = "=0.5.1"
curve25519-dalek = { version = "=4.1.3", default-features = false }
num-bigint = "=0.4.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
